    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
            background-color: #FFFDF5;
            color: #3D3430;
            user-select: none;
            overflow-x: hidden;
        }

        /* Floating Clouds Background Animation */
        @keyframes cloudFloatLeft {
            0% { transform: translateX(-5vw); }
            50% { transform: translateX(5vw); }
            100% { transform: translateX(-5vw); }
        }
        @keyframes cloudFloatRight {
            0% { transform: translateX(5vw); }
            50% { transform: translateX(-5vw); }
            100% { transform: translateX(5vw); }
        }
        .animate-cloud-left { animation: cloudFloatLeft 16s ease-in-out infinite; }
        .animate-cloud-right { animation: cloudFloatRight 14s ease-in-out infinite; }

        /* Deer Bobbing Hover Animation */
        @keyframes deerHover {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1.2deg); }
        }
        .animate-deer-hover {
            animation: deerHover 3.2s ease-in-out infinite;
        }

        /* Wiggling Antler Animations */
        @keyframes antlerWiggleL {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg); }
        }
        @keyframes antlerWiggleR {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        .antler-l { transform-origin: bottom right; animation: antlerWiggleL 2.6s ease-in-out infinite; }
        .antler-r { transform-origin: bottom left; animation: antlerWiggleR 2.6s ease-in-out infinite 0.2s; }

        /* Heart Light Pulse */
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #FF5252); }
            50% { transform: scale(1.25); filter: drop-shadow(0 0 12px #FF5252); }
        }
        .heart-pulse {
            transform-origin: center;
            animation: heartPulse 1.1s ease-in-out infinite;
        }

        /* Robotic Arm Packing Throw Motion */
        @keyframes armPackSwing {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(-30deg); }
            65% { transform: rotate(25deg); }
            100% { transform: rotate(0deg); }
        }
        .arm-pack-anim {
            transform-origin: 15% 20%;
            animation: armPackSwing 0.52s ease-in-out;
        }

        /* Food Box Elastic Compression Physics */
        @keyframes boxSquishBounce {
            0% { transform: scale(1, 1); }
            25% { transform: scale(1.12, 0.86); }
            50% { transform: scale(0.92, 1.08); }
            75% { transform: scale(1.04, 0.96); }
            100% { transform: scale(1, 1); }
        }
        .box-squish {
            animation: boxSquishBounce 0.48s ease-in-out;
        }

        /* Floating Particle Effects (+1 營養 / Sparkles / Hearts) */
        .particle-effect {
            position: absolute;
            pointer-events: none;
            z-index: 60;
            animation: particleFloatUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes particleFloatUp {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.4) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: translateY(-25px) scale(1.25) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-85px) scale(0.85) rotate(15deg);
            }
        }

        /* Background Dot Pattern */
        .bg-dots {
            background-image: radial-gradient(#FFC107 2.2px, transparent 2.2px), radial-gradient(#FF7A00 2.2px, #FFFDF5 2.2px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        /* Cardboard Texture Effect */
        .bg-cardboard {
            background-color: #D9A05B;
            background-image: radial-gradient(#C68E4C 15%, transparent 16%), radial-gradient(#B88242 15%, transparent 16%);
            background-size: 14px 14px;
            background-position: 0 0, 7px 7px;
        }
    </style>
</head>

        // Dynamic LED Eye SVG Paths
        const faceExpressions = {
            happy: `<path d="M 76 80 Q 84 70 92 80" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M 108 80 Q 116 70 124 80" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none" />`,
            sparkle: `<path d="M 84 70 L 84 86 M 76 78 L 92 78" stroke="#FFC107" stroke-width="4.5" stroke-linecap="round" /><path d="M 116 70 L 116 86 M 108 78 L 124 78" stroke="#FFC107" stroke-width="4.5" stroke-linecap="round" />`,
            heartEyes: `<path d="M 84 82 C 78 72, 72 80, 84 88 C 96 80, 90 72, 84 82 Z" fill="#FF5252" /><path d="M 116 82 C 110 72, 104 80, 116 88 C 128 80, 122 72, 116 82 Z" fill="#FF5252" />`,
            wink: `<path d="M 76 80 Q 84 70 92 80" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none" /><line x1="108" y1="78" x2="124" y2="78" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />`
        };

        // Web Audio Synthesizer for Cute Sound FX
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playCuteSound(type) {
            if (isMuted) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'drop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(750, now + 0.14);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.14);
                } else if (type === 'pop') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (e) {
                // Ignore audio context initialization exceptions
            }
        }

        // DOM Element Cache
        const boxItemsStack = document.getElementById('boxItemsStack');
        const boxItemBadge = document.getElementById('boxItemBadge');
        const headerCounter = document.getElementById('headerCounter');
        const deerFaceEyes = document.getElementById('deerFaceEyes');
        const rightRoboticArm = document.getElementById('rightRoboticArm');
        const armItemEmoji = document.getElementById('armItemEmoji');
        const boxVisualContainer = document.getElementById('boxVisualContainer');
        const deerSpeechBubble = document.getElementById('deerSpeechBubble');
        const flyingItemsContainer = document.getElementById('flyingItemsContainer');

        // Render Stacked Items in Cardboard Box
        function renderBoxStack() {
            boxItemsStack.innerHTML = '';
            currentBoxItems.forEach(item => {
                const tag = document.createElement('div');
                tag.className = `px-2 py-1 rounded-xl font-black text-xs flex items-center gap-1 border-2 shadow-sm ${item.bg}`;
                tag.innerHTML = `<span>${item.emoji}</span><span>${item.name}</span>`;
                boxItemsStack.appendChild(tag);
            });

            boxItemBadge.textContent = `箱內物資：${currentBoxItems.length} 件`;
            headerCounter.textContent = totalPackedCount.toLocaleString();
        }

        // Facial Expression Setter
        window.setDeerExpression = function(expKey) {
            if (faceExpressions[expKey]) {
                deerFaceEyes.innerHTML = faceExpressions[expKey];
                playCuteSound('pop');
            }
        };

        // Main Drop Item Trigger Function
        function triggerDropSupply() {
            if (isPacking) return;
            isPacking = true;

            const chosenItem = foodPool[Math.floor(Math.random() * foodPool.length)];

            // 1. Robotic Arm Throw Motion & Expression Change
            rightRoboticArm.classList.add('arm-pack-anim');
            deerFaceEyes.innerHTML = faceExpressions.sparkle;
            armItemEmoji.textContent = chosenItem.emoji;

            playCuteSound('drop');

            // 2. Flying Bezier Arc Element
            const flyingEl = document.createElement('div');
            flyingEl.className = 'absolute text-3xl sm:text-4xl transition-all duration-500 ease-in-out pointer-events-none z-50';
            flyingEl.textContent = chosenItem.emoji;
            flyingEl.style.left = '32%';
            flyingEl.style.top = '48%';

            flyingItemsContainer.appendChild(flyingEl);

            // Bezier Flight Curve Trajectory Movement
            setTimeout(() => {
                flyingEl.style.transform = 'translate(140px, -20px) scale(0.8) rotate(180deg)';
                flyingEl.style.opacity = '0.95';
            }, 30);

            // Item Lands into Box Event
            setTimeout(() => {
                flyingEl.remove();
                rightRoboticArm.classList.remove('arm-pack-anim');
                deerFaceEyes.innerHTML = faceExpressions.heartEyes;

                playCuteSound('pop');

                // Box Squish Elastic Physics Bounce
                boxVisualContainer.classList.add('box-squish');
                setTimeout(() => boxVisualContainer.classList.remove('box-squish'), 480);

                // Add Item to Stack
                currentBoxItems.push(chosenItem);
                totalPackedCount++;
                renderBoxStack();

                // Spawn Sparkles and +1 Floating Particles
                spawnParticles();

                // Random Speech Bubble Reaction
                const speechMsgs = [
                    `太讚了！已將【${chosenItem.name}】裝好！`,
                    `叮咚！又多了一份愛心物資！`,
                    `安得烈食物箱滿載溫暖中！`
                ];
                deerSpeechBubble.textContent = speechMsgs[Math.floor(Math.random() * speechMsgs.length)];

                setTimeout(() => {
                    deerFaceEyes.innerHTML = faceExpressions.happy;
                    isPacking = false;
                }, 380);

            }, 500);
        }

        window.userTriggerPack = function() {
            triggerDropSupply();
        };

        // Toggle Continuous Auto-Pack Interval
        window.toggleAutoPack = function() {
            const btn = document.getElementById('autoPackBtn');
            const text = document.getElementById('autoPackText');

            if (autoPackTimer) {
                clearInterval(autoPackTimer);
                autoPackTimer = null;
                text.textContent = '🤖 自動連續裝箱';
                btn.className = "w-full sm:w-auto px-6 py-3.5 bg-amber-300 hover:bg-amber-400 text-andrew-dark font-black text-sm sm:text-base rounded-2xl border-3 border-andrew-dark shadow-cartoon hover:-translate-y-0.5 active:translate-y-1 transition-all flex items-center justify-center gap-2";
            } else {
                triggerDropSupply();
                autoPackTimer = setInterval(triggerDropSupply, 1300);
                text.textContent = '⏸️ 暫停自動裝箱';
                btn.className = "w-full sm:w-auto px-6 py-3.5 bg-rose-400 text-white font-black text-sm sm:text-base rounded-2xl border-3 border-andrew-dark shadow-cartoon animate-pulse flex items-center justify-center gap-2";
            }
        };

        // Floating Particle Popups
        function spawnParticles() {
            const symbols = ['+1 營養', '💖', '✨', '🌾', '🥛', '🌟'];
            for (let i = 0; i < 5; i++) {
                const p = document.createElement('div');
                p.className = 'particle-effect font-black text-xs sm:text-sm text-andrew-red';
                p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                
                const randX = window.innerWidth > 640 ? 560 + (Math.random() * 60 - 30) : 220;
                const randY = 240 + (Math.random() * 30 - 15);

                p.style.left = `${randX}px`;
                p.style.top = `${randY}px`;

                flyingItemsContainer.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        // Toggle Mute Audio
        window.toggleAudioMute = function() {
            isMuted = !isMuted;
            const icon = document.getElementById('soundIcon');
            if (isMuted) {
                icon.className = "fa-solid fa-volume-xmark text-lg text-rose-500";
            } else {
                icon.className = "fa-solid fa-volume-high text-lg text-amber-800";
                playCuteSound('pop');
            }
        };

        // Interactive Deer Click Event
        document.getElementById('andrewDeerRobot').addEventListener('click', () => {
            setDeerExpression('wink');
            deerSpeechBubble.textContent = "嗶嗶！謝謝你跟安得鹿一起做公益！💖";
            setTimeout(() => setDeerExpression('happy'), 900);
        });

        // Initialize Render
        renderBoxStack();
    </script>
</body>
</html>
